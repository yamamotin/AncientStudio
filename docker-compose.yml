services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8000
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
    ports:
      - "8000:8000"
    depends_on:
      n8n:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.82.1
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?set N8N_BASIC_AUTH_USER in .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?set N8N_BASIC_AUTH_PASSWORD in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      # Bound to loopback: expose through a TLS reverse proxy in production.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  n8n-data:
