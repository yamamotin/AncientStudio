[project]
name = "ancientstudio-backend"
version = "1.0.0"
description = "FastAPI backend for AncientStudio (ETL, fiscal gateway, n8n workflows)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Depends()/Header() are intentionally used as default values.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
