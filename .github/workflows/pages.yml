name: Deploy static site to GitHub Pages

# This workflow publishes the exact commit that Vercel builds from `main`.
# Source of truth: the root of the repository (no framework, no npm, no build).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage only browser-facing files. api/ and Dockerfile stay out of Pages,
      # so the static asset set is identical on both hosts (relative paths only).
      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R index.html robots.txt sitemap.xml api-status.json assets _site/
          printf '%s\n' "$GITHUB_SHA" > _site/build.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
