name: Deploy static site to GitHub Pages

# This workflow publishes the exact commit that Vercel builds from `main`.
# Source of truth: the root of the repository (no framework, no npm, no build).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit to publish (defaults to main HEAD)"
        required: false
        type: string

# `workflow_dispatch` is the reliable deploy path after an agent merge: pushes
# performed with GITHUB_TOKEN do not start new workflow runs.
env:
  DEPLOY_SHA: ${{ inputs.sha || github.sha }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Stage only browser-facing files. api/ and Dockerfile stay out of Pages,
      # so the static asset set is identical on both hosts (relative paths only).
      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R index.html robots.txt sitemap.xml api-status.json assets _site/
          printf '%s\n' "$DEPLOY_SHA" > _site/build.txt

      # Fail early if the artifact root is wrong; project Pages needs index.html
      # at the artifact root (URL /AncientStudio/), not inside an extra folder.
      - name: Verify static artifact root
        run: |
          test -f _site/index.html
          test -f _site/build.txt
          test -f _site/assets/css/style.css
          test -f _site/assets/i18n/pt-br.json
          test -f _site/assets/i18n/en.json
          test -f _site/assets/js/api-client.js
          test -f _site/assets/js/engine-adapter.js
          test -f _site/assets/js/ascii-engine.bundle.js
          test -s _site/assets/js/ascii-engine.bundle.js
          test -f _site/assets/cv/Eron_Yamamoto_Curriculo_BR_Pleno.pdf
          test -f _site/assets/cv/Eron_Yamamoto_Resume_EN.pdf
          test -f _site/assets/fonts/jetbrains-mono-latin-400-normal.woff2
          echo "Pages artifact root OK ($(find _site -type f | wc -l) files)"

      # GITHUB_TOKEN cannot enable Pages by API: configure-pages `enablement`
      # requires a PAT/app token. Settings → Pages → Source must already be
      # "GitHub Actions". See docs/pages-recovery.md.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Non-blocking: a divergence or CDN delay must never fail the deploy above.
  verify-parity:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    env:
      PAGES_URL: https://yamamotin.github.io/AncientStudio
      VERCEL_URL: https://ancientstudio.vercel.app
    steps:
      - name: Wait for edge caches
        run: sleep 25

      - name: Compare deployed SHAs
        run: |
          # Cache-buster: without a unique query both CDNs can return the
          # previous commit and parity would pass against a stale deployment.
          pages_sha=$(curl -fsSL --retry 5 --retry-delay 5 "$PAGES_URL/build.txt?v=$DEPLOY_SHA" | tr -d '[:space:]')
          vercel_sha=$(curl -fsSL --retry 5 --retry-delay 5 "$VERCEL_URL/api/v1/build?v=$DEPLOY_SHA" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')
          echo "pages_sha=$pages_sha"
          echo "vercel_sha=$vercel_sha"
          if [ -z "$pages_sha" ] || [ -z "$vercel_sha" ]; then
            echo "::warning::Could not read one of the deployed SHAs; skipping comparison."
            exit 0
          fi
          if [ "$pages_sha" != "$vercel_sha" ]; then
            echo "::warning::Versions diverged: Pages=$pages_sha Vercel=$vercel_sha"
            exit 1
          fi
          echo "Parity OK: both hosts serve $pages_sha"
