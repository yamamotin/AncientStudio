name: PR tests

# Modular, dependency-free test base for future PR automation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run static and engine contract tests
        run: node --test tests/*.test.js
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
