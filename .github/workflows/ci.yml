name: CI — Backend, ASCII 3D Engine & Portfolio Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ascii-engine-module/package-lock.json

      - name: Typecheck & build decoupled 3D ASCII engine + portfolio bundle
        working-directory: ascii-engine-module
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run build:portfolio

      - name: Verify portfolio bundle is built and non-empty
        run: |
          test -s assets/js/ascii-engine.bundle.js

      - name: Run Node static & engine contract tests
        run: node --test tests/*.test.js

      - name: Run Python backend & static security unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
